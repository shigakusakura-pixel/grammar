<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中学英文法 完全マスター</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.eg{font-family:'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;background:#f0f4f8}
.hd{background:#1a5fa8;color:#fff;padding:16px 20px 0}
.ti{font-size:28px;font-weight:500;letter-spacing:.06em;margin-bottom:8px;text-shadow:-1px -1px 0 #0a3d7a,1px -1px 0 #0a3d7a,-1px 1px 0 #0a3d7a,1px 1px 0 #0a3d7a}
.hb{display:flex;justify-content:space-between;align-items:flex-end}
.tb{padding:8px 22px;border-radius:8px 8px 0 0;font-size:15px;cursor:pointer;background:rgba(255,255,255,.18);color:#ffd580;border:none;font-family:inherit}
.tb.a{background:#fff;color:#e8730a;font-weight:500}
.sm{font-size:13px;color:#ffd580;padding:4px 10px 6px;opacity:.9}
.mn{display:flex;gap:14px;padding:14px}
.sb{width:210px;flex-shrink:0}
.st{font-size:12px;color:#666;padding:4px 10px 5px;font-weight:bold}
.nv{display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;font-size:13.5px;color:#555;border-radius:6px;cursor:pointer;background:none;border:none;text-align:left;font-family:inherit;line-height:1.4}
.nv.a{background:#1a5fa8;color:#fff}
.nv:hover:not(.a){background:rgba(0,0,0,.05)}
.star-badge{font-size:11px;color:#ffc107;font-weight:bold;background:rgba(0,0,0,0.06);padding:1px 5px;border-radius:10px}
.nv.a .star-badge{background:rgba(255,255,255,0.2);color:#ffd700}

.ct{flex:1;min-width:0}
.lh{background:#1a5fa8;color:#fff;padding:12px 20px;border-radius:10px 10px 0 0;font-size:17px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.lb{background:#fff;border:1px solid #d0d8e8;border-radius:0 0 10px 10px;padding:18px 20px}

.mode-bar{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid #1a5fa8;padding-bottom:0;flex-wrap:wrap}
.mb{padding:8px 14px;border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:bold;border-radius:8px 8px 0 0;background:#e8f1fb;color:#1a5fa8;margin-bottom:-2px}
.mb.a{background:#1a5fa8;color:white}
.mb:hover:not(.a){background:#d0e4f7}

/* 用法タブ（現在完了形用） */
.stb-bar{display:flex;gap:3px;margin-bottom:12px;border-bottom:2px solid #1a5fa8;padding-bottom:0}
.stb{padding:8px 18px;border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:bold;border-radius:8px 8px 0 0;background:#e8f1fb;color:#1a5fa8;margin-bottom:-2px}
.stb.a{background:#1a5fa8;color:white}
.stb:hover:not(.a){background:#d0e4f7}
.stc{padding-top:6px}

.g{background:#e8f1fb;border-left:4px solid #1a5fa8;border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:14px}
.gl{font-size:12px;font-weight:500;color:#1a5fa8;letter-spacing:.08em;margin-bottom:6px}
.gs{font-size:15.5px;line-height:2.1;color:#222}
.gn{font-size:14px;color:#333;margin-top:6px;line-height:1.75}
.e{color:#1a5fa8;font-weight:500}.j{color:#666;font-size:14px;margin-left:4px}.k{color:#c0392b;font-weight:bold}
.pt{background:#fff3cd;border:1px solid #f0c040;border-radius:8px;padding:10px 15px;margin-bottom:14px}
.pb{display:inline-block;background:#f0c040;color:#5a4200;font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;margin-bottom:5px}
.px{font-size:14px;color:#856404;line-height:1.75;display:block}
.ifo{background:#f2faf2;border:1px solid #5aaa5a;border-radius:8px;padding:11px 15px;margin-bottom:14px;font-size:14px;color:#2e5d2e;line-height:1.75}
.ch{background:#fff8e1;border:1px solid #f9a825;border-radius:6px;padding:8px 13px;margin-bottom:13px;font-size:13px;color:#5d4037;line-height:1.7}
.hs{background:#f2faf2;border:1px solid #5aaa5a;border-radius:6px;padding:8px 13px;margin-bottom:13px;font-size:13px;color:#2e5d2e;line-height:1.7}
.xb{display:inline-block;color:#fff;font-size:11px;font-weight:500;padding:1px 6px;border-radius:3px;margin-right:5px}
.ip{background:#fff0f0;border:1px solid #e74c3c;border-radius:8px;padding:9px 14px;margin-bottom:14px;font-size:14px;color:#333;line-height:1.7}
.ql{font-size:14px;font-weight:bold;color:#222;margin:12px 0 10px;padding-bottom:4px;border-bottom:1.5px solid #1a5fa8;display:inline-block}
.qi{margin-bottom:12px;background:#fafbfc;border:1px solid #e1e8f0;padding:10px 14px;border-radius:8px}
.qr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qn{background:#1a5fa8;color:#fff;font-size:12px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qt{flex:1;font-size:15px;color:#222;line-height:1.7;min-width:200px}
.ab,.speech-btn,.hint-btn{font-size:12.5px;padding:4px 10px;border:1px solid #1a5fa8;border-radius:5px;color:#1a5fa8;background:#fff;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap}
.speech-btn{border-color:#2e7d32;color:#2e7d32}
.speech-btn:hover{background:#e8f5e9}
.ab:hover{background:#e8f1fb}
.hint-btn{border-color:#e67e22;color:#e67e22}
.hint-btn:hover{background:#fdf2e9}
.aa{font-size:14px;color:#c0392b;margin:8px 0 4px 30px;display:none;font-weight:500;line-height:1.6}
.aa.v{display:block}

.word-pool,.answer-box{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px 30px;min-height:36px;padding:6px;border-radius:6px}
.answer-box{background:#eef4fb;border:1.5px dashed #1a5fa8}
.word-pool{background:#f0f0f0;border:1px solid #ddd}
.word-chip{background:#fff;border:1px solid #1a5fa8;color:#1a5fa8;padding:4px 10px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;user-select:none}
.word-chip:hover{background:#1a5fa8;color:#fff}

.test-score-box{text-align:center;padding:20px;background:#e8f1fb;border-radius:10px;margin-bottom:20px;border:2px solid #1a5fa8}
.test-score-num{font-size:36px;color:#1a5fa8;font-weight:bold;margin:10px 0}
.test-stars{font-size:28px;color:#ffc107}

.t1{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13.5px}
.t1 th{background:#1a5fa8;color:#fff;padding:8px 10px;text-align:center;font-weight:500;border:1px solid #1a5fa8}
.t1 td{padding:7px 10px;border:1px solid #d0d8e8;color:#333}
.t1 tr:nth-child(even) td{background:#f5f8ff}
.t1 .rd{color:#c0392b;font-weight:500}
.t2{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13px}
.t2 th{background:#1a5fa8;color:#fff;padding:6px 8px;text-align:center;font-weight:500;border:1px solid #1a5fa8}
.t2 td{padding:6px 8px;border:1px solid #d0d8e8;color:#333;text-align:center}
.t2 .lb2{font-size:12px;color:#666;background:#f8f8f8;text-align:left}
.t2 .en{color:#1a5fa8;font-weight:500}
.vc{background:#f2faf2;border:1px solid #5aaa5a;border-radius:8px;padding:11px 15px;margin-bottom:14px}
.vcl{font-size:12px;color:#2e7d32;margin-bottom:7px;font-weight:500}
.vcg{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.vci{font-size:13.5px;color:#333;line-height:1.85}
.vw{color:#1a5fa8;font-weight:500}
.nt{background:#eaf2ff;border:1px solid #b3cff0;border-radius:8px;padding:11px 15px;font-size:14px;color:#2c4a72;margin-top:14px;line-height:1.7}
.nx{color:#1a5fa8;font-weight:500}
.sn{padding:40px;text-align:center;color:#999;font-size:15px}
</style>
</head>
<body class="eg">

<div class="hd">
  <div class="ti">中学英文法 完全マスター</div>
  <div class="hb">
    <div><button class="tb a" onclick="switchGrade(1)">中 1</button><button class="tb" onclick="switchGrade(2)">中 2</button><button class="tb" onclick="switchGrade(3)">中 3</button></div>
    <div class="sm">Shigaku Seminar</div>
  </div>
</div>

<div class="mn">
  <div id="sb" class="sb"></div>
  <div id="ct" class="ct"></div>
</div>

<script>
var e=function(s){return'<span class="e">'+s+'</span>';};
var j=function(s){return'<span class="j">'+s+'</span>';};
var k=function(s){return'<span class="k">'+s+'</span>';};
var br='<br>';
var pt=function(l,c){return'<span style="background:'+c+';color:white;font-size:12px;padding:2px 8px;border-radius:3px;margin-right:5px">'+l+'</span>';};
function G(l,s,n){return'<div class="g"><div class="gl">'+l+'</div><div class="gs">'+s+'</div>'+(n?'<div class="gn">'+n+'</div>':'')+'</div>';}
function PT(t){return'<div class="pt"><span class="pb">ポイント</span><span class="px">'+t+'</span></div>';}
function IF(t){return'<div class="ifo">'+t+'</div>';}
function CH(t){return'<div class="ch"><span class="xb" style="background:#f9a825">注意</span>'+t+'</div>';}
function HS(t){return'<div class="hs"><span class="xb" style="background:#5aaa5a">補足</span>'+t+'</div>';}
function IP(t){return'<div class="ip"><span class="xb" style="background:#e74c3c">重要</span><br>'+t+'</div>';}
function DV(){return'<div class="dv"></div>';}
function NT(t){return'<div class="nt">💡 次の単元：<span class="nx">'+t+'</span></div>';}

function speak(text){
  if(!('speechSynthesis' in window)){alert("お使いのブラウザは音声再生に対応していません。");return;}
  window.speechSynthesis.cancel();
  var cleanText = text.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').split('/')[0].trim();
  var uttr = new SpeechSynthesisUtterance(cleanText);
  uttr.lang = 'en-US';
  uttr.rate = 0.85;
  window.speechSynthesis.speak(uttr);
}

function getSavedStar(grade, unitIdx){
  return localStorage.getItem('grammar_star_g'+grade+'_u'+unitIdx) || '';
}
function saveStar(grade, unitIdx, stars){
  localStorage.setItem('grammar_star_g'+grade+'_u'+unitIdx, stars);
  buildNav(curGrade);
}

var currentMode = 'arrange';

function setMode(m){
  currentMode = m;
  document.querySelectorAll('.mb').forEach(function(btn){btn.classList.remove('a');});
  var activeBtn = document.getElementById('btn-mode-'+m);
  if(activeBtn) activeBtn.classList.add('a');
  renderCurrentUnit();
}

function showST(n, btn){
  document.querySelectorAll('.stc').forEach(function(el){el.style.display='none';});
  document.querySelectorAll('.stb').forEach(function(b){b.classList.remove('a');});
  var target = document.getElementById('st'+n);
  if(target) target.style.display='block';
  btn.classList.add('a');
}

function renderQuestionSet(qs, isTest, offsetIdx){
  offsetIdx = offsetIdx || 0;
  return qs.map(function(qa, idx){
    var i = offsetIdx + idx;
    var jp = qa[0];
    var en = qa[1];
    var cleanEn = en.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').split('/')[0].trim();
    var words = cleanEn.replace(/[.,?!]/g, '').split(/\s+/);

    var contentHtml = '';
    
    if(currentMode === 'translate' || isTest){
      contentHtml = '<button class="ab" onclick="ta(this)">解答を見る</button></div>' +
                    '<div class="aa">答え：'+en+' <button class="speech-btn" onclick="speak(\''+cleanEn.replace(/'/g,"\\'")+'\')">🔊 発音</button></div>';
    } 
    else if(currentMode === 'arrange'){
      var shuffled = words.slice().sort(function(){return Math.random() - 0.5;});
      var chips = shuffled.map(function(w){
        return '<button class="word-chip" onclick="pickWord(this, '+i+')">'+w+'</button>';
      }).join('');
      
      contentHtml = '<button class="hint-btn" onclick="ta(this)">答えを見る</button>' +
                    '<button class="speech-btn" onclick="speak(\''+cleanEn.replace(/'/g,"\\'")+'\')">🔊</button></div>' +
                    '<div class="answer-box" id="ans-box-'+i+'"></div>' +
                    '<div class="word-pool" id="pool-box-'+i+'">'+chips+'</div>' +
                    '<div class="aa">正解：'+en+'</div>';
    }
    else if(currentMode === 'fill'){
      var hideIdx = words.length > 2 ? 1 : 0;
      var targetWord = words[hideIdx];
      var blankEn = words.map(function(w, idx){ return idx === hideIdx ? '（ &nbsp;&nbsp;&nbsp;&nbsp; ）' : w; }).join(' ');
      
      contentHtml = '<button class="ab" onclick="ta(this)">答え・解説</button>' +
                    '<button class="speech-btn" onclick="speak(\''+cleanEn.replace(/'/g,"\\'")+'\')">🔊</button></div>' +
                    '<div style="margin:6px 0 4px 30px; font-weight:bold; color:#1a5fa8; font-size:15px">'+blankEn+'</div>' +
                    '<div class="aa">空欄に入る語：<b>'+targetWord+'</b> （全体: '+en+'）</div>';
    }

    return '<div class="qi" id="qi-'+i+'">' +
             '<div class="qr">' +
               '<div class="qn">'+(idx+1)+'</div>' +
               '<div class="qt">'+jp+'</div>' +
               contentHtml +
           '</div>';
  }).join('');
}

function pickWord(btn, qIdx){
  var ansBox = document.getElementById('ans-box-'+qIdx);
  if(btn.parentNode === ansBox){
    document.getElementById('pool-box-'+qIdx).appendChild(btn);
  } else {
    ansBox.appendChild(btn);
  }
}

function ta(btn){
  var a=btn.closest('.qi').querySelector('.aa');
  a.classList.toggle('v');
  btn.textContent=a.classList.contains('v')?'隠す':'解答を見る';

  if (a.classList.contains('v') && window.sendLearningRecord) {
    var qnNode = btn.closest('.qi').querySelector('.qn');
    var qNum = qnNode ? qnNode.textContent : '';
    var unitTitleNode = document.querySelector('.lh');
    var unitTitle = unitTitleNode ? unitTitleNode.textContent : '中学英文法';
    window.sendLearningRecord(unitTitle, '問' + qNum);
  }
}

var PTBL='<table class="t1"><tr><th>名詞の種類</th><th>複数形のつくり方</th><th>例</th></tr><tr><td>一般的な名詞</td><td class="rd">語尾に s</td><td>pen→<b style="color:#1a5fa8">pens</b></td></tr><tr><td>語尾が s,sh,ch,o,x</td><td class="rd">語尾に es</td><td>box→<b style="color:#1a5fa8">boxes</b></td></tr><tr><td>語尾が子音字＋y</td><td class="rd">y を i にかえて es</td><td>city→<b style="color:#1a5fa8">cities</b></td></tr><tr><td>語尾が f,fe</td><td class="rd">f,fe を v にかえて es</td><td>life→<b style="color:#1a5fa8">lives</b></td></tr><tr><td>不規則に変化する</td><td class="rd">それぞれ</td><td>man→<b style="color:#1a5fa8">men</b></td></tr><tr><td>変化しない</td><td class="rd">同じ</td><td>fish→<b style="color:#1a5fa8">fish</b></td></tr></table>';
var PRTBL='<table class="t2"><tr><th rowspan="2" style="width:48px"></th><th colspan="4">単 数</th><th colspan="4">複 数</th></tr><tr><th>主格</th><th>所有格</th><th>目的格</th><th>所有代</th><th>主格</th><th>所有格</th><th>目的格</th><th>所有代</th></tr><tr><td class="lb2">1人称</td><td class="en">I</td><td class="en">my</td><td class="en">me</td><td class="en">mine</td><td class="en">we</td><td class="en">our</td><td class="en">us</td><td class="en">ours</td></tr><tr><td class="lb2">2人称</td><td class="en">you</td><td class="en">your</td><td class="en">you</td><td class="en">yours</td><td class="en">you</td><td class="en">your</td><td class="en">yours</td></tr><tr><td class="lb2" rowspan="3">3人称</td><td class="en">he</td><td class="en">his</td><td class="en">him</td><td class="en">his</td><td class="en" rowspan="3">they</td><td class="en" rowspan="3">their</td><td class="en" rowspan="3">them</td><td class="en" rowspan="3">theirs</td></tr><tr><td class="en">she</td><td class="en">her</td><td class="en">her</td><td class="en">hers</td></tr><tr><td class="en">it</td><td class="en">its</td><td class="en">it</td><td style="color:#aaa">—</td></tr></table>';
var VOCA='<div class="vc"><div class="vcl">✓ いろいろな一般動詞</div><div class="vcg"><div class="vci"><span class="vw">like</span>「好きである」</div><div class="vci"><span class="vw">study</span>「勉強する」</div><div class="vci"><span class="vw">play</span>「（スポーツを）する」</div><div class="vci"><span class="vw">wash</span>「洗う」</div><div class="vci"><span class="vw">come</span>「来る」</div><div class="vci"><span class="vw">write</span>「書く」</div><div class="vci"><span class="vw">speak</span>「話す」</div><div class="vci"><span class="vw">cook</span>「料理する」</div><div class="vci"><span class="vw">eat</span>「食べる」</div><div class="vci"><span class="vw">use</span>「使う」</div><div class="vci"><span class="vw">drink</span>「飲む」</div><div class="vci"><span class="vw">listen</span>「聴く」</div><div class="vci"><span class="vw">have</span>「持っている」</div><div class="vci"><span class="vw">go</span>「行く」</div><div class="vci"><span class="vw">love</span>「大好きである」</div><div class="vci"><span class="vw">want</span>「ほしい」</div><div class="vci"><span class="vw">read</span>「読む」</div><div class="vci"><span class="vw">send</span>「送る」</div><div class="vci"><span class="vw">watch</span>「観る」</div><div class="vci"><span class="vw">live</span>「住む」</div><div class="vci"><span class="vw">clean</span>「掃除する」</div><div class="vci"><span class="vw">run</span>「走る」</div><div class="vci"><span class="vw">make</span>「作る」</div><div class="vci"><span class="vw">walk</span>「歩く」</div><div class="vci"><span class="vw">open</span>「開ける」</div><div class="vci"><span class="vw">swim</span>「泳ぐ」</div><div class="vci"><span class="vw">close</span>「閉じる」</div><div class="vci"><span class="vw">know</span>「知っている」</div><div class="vci"><span class="vw">sing</span>「歌う」</div><div class="vci"><span class="vw">look, see</span>「見る」</div></div></div>';

var U1={}, U2={}, U3={};

U1[1]={t:"1. I am〜・You are〜",
  g: function(){ return G("文法 ▶ I am〜 ・ You are〜",e("I am")+" Yuki."+j("（私は由紀です。）")+br+e("You are")+" from China."+j("（あなたは中国出身ですね。）"),"☞ "+k("I am〜")+"「私は〜です。」 ☞ "+k("You are〜")+"「あなたは〜です（ね）。」"); },
  q: [["私は健二です。","I am Kenji."],["私は日本出身です。","I am from Japan."],["私は中学生です。","I am a junior high school student."],["あなたはオーストラリア出身ですか。― はい、そうです。","Are you from Australia? — Yes, I am."],["あなたは学生ですか。― いいえ、ちがいます。","Are you a student? — No, I'm not."],["私はアメリカ出身ではありません。","I am not from America."],["あなたは医者ではありません。","You are not a doctor."],["私はテニスファンではありません。","I am not a tennis fan."]],
  nt: "2. 一般動詞①（一・二人称）"
};

U1[2]={t:"2. 一般動詞①（一・二人称）",
  g: function(){ return G("文法 ▶ 一般動詞（肯定文・疑問文・否定文）","I "+e("have")+" a dog."+j("（私は犬を飼っています。）")+br+e("Do you")+" speak English? — Yes, "+e("I do.")+" / No, "+e("I don't.")+br+e("I don't")+" use a computer.","☞ haveやplayなどを"+k("一般動詞")+"といいます。 ☞ "+k("Do you〜?")+"「あなたは〜しますか。」")+VOCA; },
  q: [["私はお寿司を食べます。","I eat sushi."],["あなたは毎日部屋を掃除します。","You clean your room every day."],["私は英語と数学を勉強します。","I study English and math."],["あなたはテレビを観ますか。― はい、観ます。","Do you watch TV? — Yes, I do."],["あなたは音楽を聴きますか。― いいえ、聴きません。","Do you listen to music? — No, I don't."],["私はピアノを弾きません。","I don't play the piano."],["あなたは英語を話しません。","You don't speak English."],["私は手紙を書きません。","I don't write letters."]],
  nt: "3. 助動詞 can①"
};

var DATA={1:U1,2:U2,3:U3};
var curGrade=1;
var curUnitIdx=1;

function switchGrade(g){
  curGrade=g;
  document.querySelectorAll('.tb').forEach(function(b,i){b.classList.toggle('a',i===g-1);});
  buildNav(g);
  var first=NAV[g][0]?NAV[g][0][1]:null;
  if(first){goUnit(first);}else{document.getElementById('ct').innerHTML='<div class="sn">🚧 この学年は現在準備中です。</div>';}
}

function buildNav(g){
  var lbl=g===1?"【中 1】単元一覧":g===2?"【中 2】単元一覧":"【中 3】単元一覧";
  var h='<div class="st">'+lbl+'</div>';
  NAV[g].forEach(function(item,i){
    var n=item[1];
    var style=n?'':'style="color:#aaa;cursor:default"';
    var click=n?'onclick="goUnit('+n+')"':'';
    var star = getSavedStar(g, n);
    var starBadge = star ? '<span class="star-badge">'+star+'</span>' : '';
    h+='<button class="nv" '+click+' '+style+' data-idx="'+i+'"><span>'+item[0]+'</span>'+starBadge+'</button>';
  });
  document.getElementById('sb').innerHTML=h;
}

function goUnit(n){
  curUnitIdx = n;
  renderCurrentUnit();
}

function renderCurrentUnit(){
  var d=DATA[curGrade][curUnitIdx];
  var html;
  if(d){
    var gl=curGrade===1?"中 1":curGrade===2?"中 2":"中 3";
    
    var modeBar = '<div class="mode-bar">' +
      '<button id="btn-mode-arrange" class="mb '+(currentMode==='arrange'?'a':'')+'" onclick="setMode(\'arrange\')">🧩 並べ替え</button>' +
      '<button id="btn-mode-fill" class="mb '+(currentMode==='fill'?'a':'')+'" onclick="setMode(\'fill\')">✏️ 穴埋め</button>' +
      '<button id="btn-mode-translate" class="mb '+(currentMode==='translate'?'a':'')+'" onclick="setMode(\'translate\')">✍️ 英作文</button>' +
      '<button id="btn-mode-test" class="mb '+(currentMode==='test'?'a':'')+'" onclick="startTestMode()">🎯 10問テスト</button>' +
    '</div>';

    var bodyContent = '';
    if(currentMode === 'test'){
      bodyContent = renderTestUI(d.q);
    } else {
      if(typeof d.customRender === 'function'){
        bodyContent = d.customRender();
      } else {
        bodyContent = d.g() + '<div class="ql">【演習問題】</div>' + renderQuestionSet(d.q, false);
      }
    }

    var recordBtn = '<div style="text-align:center; margin-top:30px; padding-top:20px; border-top:1px dashed #ccc;"><button onclick="finishGrammarUnit(this)" style="background:#e8f1fb; border:2px solid #1a5fa8; padding:12px 24px; border-radius:8px; color:#1a5fa8; font-weight:bold; cursor:pointer; font-size:15px; box-shadow:0 2px 6px rgba(0,0,0,0.1); transition:0.2s;">✅ この単元の学習を記録する</button></div>';

    html='<div class="lh"><span>【'+gl+'】'+d.t+'</span></div><div class="lb">'+modeBar+bodyContent+recordBtn+'</div>';
  }else{
    html='<div class="sn">🚧 この単元は現在準備中です。</div>';
  }
  document.getElementById('ct').innerHTML=html;
  
  document.querySelectorAll('.nv').forEach(function(b){
    var idx=parseInt(b.getAttribute('data-idx'));
    var match=NAV[curGrade][idx]&&NAV[curGrade][idx][1]===curUnitIdx;
    b.classList.toggle('a',match);
  });
}

var testQuestions = [];
function startTestMode(){
  currentMode = 'test';
  var d=DATA[curGrade][curUnitIdx];
  var qList = d.q.slice();
  testQuestions = qList.sort(function(){return Math.random()-0.5;}).slice(0, Math.min(10, qList.length));
  renderCurrentUnit();
}

function renderTestUI(allQ){
  var qHtml = testQuestions.map(function(qa, i){
    return '<div class="qi">' +
      '<div class="qr"><div class="qn">'+(i+1)+'</div><div class="qt">'+qa[0]+'</div></div>' +
      '<div style="margin:8px 0 0 30px"><input type="text" id="test-input-'+i+'" style="width:80%; padding:6px; font-size:14px; border:1px solid #ccc; border-radius:4px" placeholder="英文を入力..."></div>' +
    '</div>';
  }).join('');

  return '<div style="background:#fff3cd; padding:10px 14px; border-radius:6px; margin-bottom:14px; font-size:13.5px; color:#856404">🎯 <b>10問確認テスト</b>：英文を入力し、「採点する」ボタンを押してください。</div>' +
    qHtml +
    '<div style="text-align:center; margin:20px 0"><button onclick="gradeTest()" style="background:#28a745; color:#fff; border:none; padding:10px 30px; font-size:16px; font-weight:bold; border-radius:6px; cursor:pointer">💯 採点する</button></div>' +
    '<div id="test-result-box"></div>';
}

async function gradeTest(){
  var correctCount = 0;
  testQuestions.forEach(function(qa, i){
    var input = document.getElementById('test-input-'+i);
    var userAns = input ? input.value.trim().toLowerCase().replace(/[.,?!]/g, '') : '';
    var targetAns = qa[1].toLowerCase().replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').replace(/[.,?!]/g, '').trim();
    
    if(userAns === targetAns){
      correctCount++;
      input.style.borderColor = "#28a745";
      input.style.background = "#e8f8f0";
    } else {
      input.style.borderColor = "#dc3545";
      input.style.background = "#fdf2f2";
    }
  });

  var score = Math.round((correctCount / testQuestions.length) * 100);
  var starStr = score === 100 ? '★★★' : score >= 80 ? '★★☆' : '★☆☆';
  
  saveStar(curGrade, curUnitIdx, starStr);

  var unitTitleNode = document.querySelector('.lh');
  var unitTitle = unitTitleNode ? unitTitleNode.textContent : '中学英文法';

  if (window.sendLearningRecord) {
    await window.sendLearningRecord(unitTitle, `学習完了 (10問テスト: ${score}点 ${starStr})`);
  }

  document.getElementById('test-result-box').innerHTML = 
    '<div class="test-score-box">' +
      '<h3>テスト結果</h3>' +
      '<div class="test-score-num">'+score+' 点</div>' +
      '<div class="test-stars">'+starStr+'</div>' +
      '<p style="font-size:13px; color:#666; margin-top:8px">結果を学習ポータルに送信し、単元一覧に★を記録しました！</p>' +
    '</div>';
}

// ===== 英文法 タイマー＆送信処理 =====
  let grammarStartTime = Date.now();

  window.finishGrammarUnit = async function(btn) {
    if (btn.disabled) return;
    var unitTitleNode = document.querySelector('.lh');
    var unitTitle = unitTitleNode ? unitTitleNode.textContent : '中学英文法';
    
    if (window.sendLearningRecord) {
      btn.disabled = true;
      btn.textContent = "⏳ 送信中...";

      const durationSec = Math.floor((Date.now() - grammarStartTime) / 1000);
      await window.sendLearningRecord(unitTitle, `学習完了 (${typeof currentMode !== 'undefined' ? currentMode : '通常'}モード)`, durationSec);

      btn.textContent = "✅ 記録しました！";
      btn.style.background = "#d4edda";
      btn.style.color = "#155724";

      grammarStartTime = Date.now();
    }
  };

  // 初期表示
  if (typeof buildNav === 'function') buildNav(1);
  if (typeof goUnit === 'function') goUnit(1);
</script>
