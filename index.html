var PTBL='<table class="t1"><tr><th>名詞の種類</th><th>複数形のつくり方</th><th>例</th></tr><tr><td>一般的な名詞</td><td class="rd">語尾に s</td><td>pen→<b style="color:#1a5fa8">pens</b></td></tr><tr><td>語尾が s,sh,ch,o,x</td><td class="rd">語尾に es</td><td>box→<b style="color:#1a5fa8">boxes</b></td></tr><tr><td>語尾が子音字＋y</td><td class="rd">y を i にかえて es</td><td>city→<b style="color:#1a5fa8">cities</b></td></tr><tr><td>語尾が f,fe</td><td class="rd">f,fe を v にかえて es</td><td>life→<b style="color:#1a5fa8">lives</b></td></tr><tr><td>不規則に変化する</td><td class="rd">それぞれ</td><td>man→<b style="color:#1a5fa8">men</b></td></tr><tr><td>変化しない</td><td class="rd">同じ</td><td>fish→<b style="color:#1a5fa8">fish</b></td></tr></table>';
var PRTBL='<table class="t2"><tr><th rowspan="2" style="width:44px"></th><th colspan="4">単　数</th><th colspan="4">複　数</th></tr><tr><th>主格</th><th>所有格</th><th>目的格</th><th>所有代</th><th>主格</th><th>所有格</th><th>目的格</th><th>所有代</th></tr><tr><td class="lb2">1人称</td><td class="en">I</td><td class="en">my</td><td class="en">me</td><td class="en">mine</td><td class="en">we</td><td class="en">our</td><td class="en">us</td><td class="en">ours</td></tr><tr><td class="lb2">2人称</td><td class="en">you</td><td class="en">your</td><td class="en">you</td><td class="en">yours</td><td class="en">you</td><td class="en">your</td><td class="en">you</td><td class="en">yours</td></tr><tr><td class="lb2" rowspan="3">3人称</td><td class="en">he</td><td class="en">his</td><td class="en">him</td><td class="en">his</td><td class="en" rowspan="3">they</td><td class="en" rowspan="3">their</td><td class="en" rowspan="3">them</td><td class="en" rowspan="3">theirs</td></tr><tr><td class="en">she</td><td class="en">her</td><td class="en">her</td><td class="en">hers</td></tr><tr><td class="en">it</td><td class="en">its</td><td class="en">it</td><td style="color:#aaa">—</td></tr></table>';
var VOCA='<div class="vc"><div class="vcl">✓ いろいろな一般動詞</div><div class="vcg"><div class="vci"><span class="vw">like</span>「好きである」</div><div class="vci"><span class="vw">study</span>「勉強する」</div><div class="vci"><span class="vw">play</span>「（スポーツを）する」</div><div class="vci"><span class="vw">wash</span>「洗う」</div><div class="vci"><span class="vw">come</span>「来る」</div><div class="vci"><span class="vw">write</span>「書く」</div><div class="vci"><span class="vw">speak</span>「話す」</div><div class="vci"><span class="vw">cook</span>「料理する」</div><div class="vci"><span class="vw">eat</span>「食べる」</div><div class="vci"><span class="vw">use</span>「使う」</div><div class="vci"><span class="vw">drink</span>「飲む」</div><div class="vci"><span class="vw">listen</span>「聴く」</div><div class="vci"><span class="vw">have</span>「持っている」</div><div class="vci"><span class="vw">go</span>「行く」</div><div class="vci"><span class="vw">love</span>「大好きである」</div><div class="vci"><span class="vw">want</span>「ほしい」</div><div class="vci"><span class="vw">read</span>「読む」</div><div class="vci"><span class="vw">send</span>「送る」</div><div class="vci"><span class="vw">watch</span>「観る」</div><div class="vci"><span class="vw">live</span>「住む」</div><div class="vci"><span class="vw">clean</span>「掃除する」</div><div class="vci"><span class="vw">run</span>「走る」</div><div class="vci"><span class="vw">make</span>「作る」</div><div class="vci"><span class="vw">walk</span>「歩く」</div><div class="vci"><span class="vw">open</span>「開ける」</div><div class="vci"><span class="vw">swim</span>「泳ぐ」</div><div class="vci"><span class="vw">close</span>「閉じる」</div><div class="vci"><span class="vw">know</span>「知っている」</div><div class="vci"><span class="vw">sing</span>「歌う」</div><div class="vci"><span class="vw">look, see</span>「見る」</div></div></div>';
var U1={};
U1[1]={t:"1. I am〜・You are〜",c:function(){return G("文法 ▶ I am〜 ・ You are〜",e("I am")+" Yuki."+j("（私は由紀です。）")+br+e("You are")+" from China."+j("（あなたは中国出身ですね。）"),"☞ "+k("I am〜")+"「私は〜です。」　☞ "+k("You are〜")+"「あなたは〜です（ね）。」")+Q("【問 1〜4】",[["私は健二です。","I am Kenji."],["私は日本出身です。","I am from Japan."],["私は中学生です。","I am a junior high school student."],["あなたはオーストラリア出身ですか。― はい、そうです。","Are you from Australia? — Yes, I am."],["あなたは学生ですか。― いいえ、ちがいます。","Are you a student? — No, I'm not."],["私はアメリカ出身ではありません。","I am not from America."],["あなたは医者ではありません。","You are not a doctor."],["私はテニスファンではありません。","I am not a tennis fan."]])+NT("2. 一般動詞①（一・二人称）");}};
U1[2]={t:"2. 一般動詞①（一・二人称）",c:function(){return G("文法 ▶ 一般動詞（肯定文・疑問文・否定文）","I "+e("have")+" a dog."+j("（私は犬を飼っています。）")+br+e("Do you")+" speak English? — Yes, "+e("I do.")+" / No, "+e("I don't.")+br+e("I don't")+" use a computer.","☞ haveやplayなどを"+k("一般動詞")+"といいます。　☞ "+k("Do you〜?")+"「あなたは〜しますか。」")+VOCA+Q("【問 1〜3】",[["私はお寿司を食べます。","I eat sushi."],["あなたは毎日部屋を掃除します。","You clean your room every day."],["私は英語と数学を勉強します。","I study English and math."],["あなたはテレビを観ますか。― はい、観ます。","Do you watch TV? — Yes, I do."],["あなたは音楽を聴きますか。― いいえ、聴きません。","Do you listen to music? — No, I don't."],["私はピアノを弾きません。","I don't play the piano."],["あなたは英語を話しません。","You don't speak English."],["私は手紙を書きません。","I don't write letters."]])+NT("3. 助動詞 can①");}};
U1[3]={t:"3. 助動詞 can①（一・二人称）",c:function(){return G("文法 ▶ can（肯定文・疑問文・否定文）","I "+e("can play")+" tennis."+j("（私はテニスをすることができます。）")+br+e("Can you")+" swim? — Yes, "+e("I can.")+" / No, "+e("I can't.")+br+"I "+e("can't speak")+" English.","☞ 「"+k("can＋動詞")+"」で「"+k("〜することができる")+"」という意味を表します。")+Q("【問 1〜3】",[["私はひらがな（hiragana）を読むことができます。","I can read hiragana."],["あなたは上手にピアノを弾くことができます。","You can play the piano well."],["あなたは漢字（kanji）を読むことができますか。― はい、できます。","Can you read kanji? — Yes, I can."],["あなたはギターを弾くことができますか。― いいえ、できません。","Can you play the guitar? — No, I can't."],["私は速く（fast）泳ぐことができません。","I can't swim fast."],["あなたはそこに行くことができません。","You can't go there."]])+NT("4. 命令文");}};
U1[4]={t:"4. 命令文",c:function(){return G("文法 ▶ 命令文・Please〜・Let's〜・Don't〜",e("Open")+" the window."+j("（窓を開けなさい。）")+br+e("Please come")+" to my house. — Sure."+br+e("Let's have")+" lunch. — Yes, let's."+br+e("Don't speak")+" Japanese here. — All right.","☞ 命令文は"+k("動詞の原形で始まり")+"、主語は省略。")+Q("【問 1〜2】",[["夕食を作りなさい。","Make dinner."],["毎日英語を勉強しなさい。","Study English every day."],["公園に行きなさい。","Go to the park."],["ケーキ（a cake）を作ってください。― いいですよ。","Please make a cake. — Sure."],["ここでテニスをしましょう。― そうしましょう。","Let's play tennis here. — Yes, let's."],["テレビを観てはいけません。― わかりました。","Don't watch TV. — All right."]])+NT("5. 複数形・How many〜？");}};
U1[5]={t:"5. 複数形・How many〜？",c:function(){return G("文法 ▶ 複数形・How many〜？","I have two "+e("dogs")+".  "+e("How many books")+" do you have? — I have four.","☞ ２つ（２人）以上の名詞の形を"+k("複数形")+"といいます。　☞ "+k("How many＋複数名詞＋疑問文？")+"の形を使います。")+PTBL+Q2("【問 1】次の語の複数形を書きなさい。",[["book（本）","books","1"],["class（クラス）","classes","2"],["chair（イス）","chairs","3"],["child（子ども）","children","4"],["dress（ドレス）","dresses","5"],["hobby（趣味）","hobbies","6"],["brother（兄・弟）","brothers","7"],["question（質問）","questions","8"],["knife（ナイフ）","knives","9"],["dish（皿）","dishes","10"],["student（生徒）","students","11"],["woman（女性）","women","12"],["bus（バス）","buses","13"],["story（物語）","stories","14"],["leaf（葉）","leaves","15"],["ball（ボール）","balls","16"],["computer（コンピューター）","computers","17"],["tooth（歯）","teeth","18"],["watch（うで時計）","watches","19"],["desk（机）","desks","20"]])+Q("【問 2】",[["あなたは何本の鉛筆を持っていますか。― ５本持っています。","How many pencils do you have? — I have five."],["あなたは何冊の本を読みますか。― ３冊読みます。","How many books do you read? — I read three."],["あなたは何個のバッグがほしいですか。― ２個ほしいです。","How many bags do you want? — I want two."],["あなたは毎週何冊の本を読みますか。― ２冊読みます。","How many books do you read every week? — I read two."],["あなたのクラスには何人の生徒がいますか。― 30人います。","How many students are there in your class? — There are thirty."]])+NT("6. This is〜・That is〜");}};
U1[6]={t:"6. This is〜・That is〜",c:function(){return G("文法 ▶ This is〜 ・ That is〜",e("This is")+" a book."+j("（これは本です。）")+br+e("Is this")+" a pen? — Yes, "+e("it is.")+" / No, "+e("it isn't.")+br+e("This is not")+" a CD.","☞ "+k("This is〜")+"「これ（こちら）は〜です。」　☞ "+k("That is〜")+"「あれ（あちら）は〜です。」")+Q("【問 1〜3】",[["これは私のカメラです。","This is my camera."],["あれは鉛筆です。","That is a pencil."],["これは私のカバンですか。― はい、そうです。","Is this your bag? — Yes, it is."],["あれはあなたの自転車ですか。― いいえ、ちがいます。","Is that your bicycle? — No, it isn't."],["これは私のコンピューターではありません。","This is not my computer."],["あれはあなたの机ではありません。","That is not your desk."]])+NT("7. What do you〜？");}};
U1[7]={t:"7. What do you〜？",c:function(){return G("文法 ▶ What do you〜？",e("What")+" do you have? — I have a book.","☞ "+k("What do you〜?")+"「あなたは何を〜しますか。」")+Q("【問】",[["あなたは何を持っていますか。― 私はカメラを持っています。","What do you have? — I have a camera."],["あなたは何を勉強しますか。― 私は英語を勉強します。","What do you study? — I study English."],["あなたは何が好きですか。― 私はテニスが好きです。","What do you like? — I like tennis."],["あなたは何を食べますか。― 私は寿司を食べます。","What do you eat? — I eat sushi."],["あなたは何がほしいですか。― 私は自転車がほしいです。","What do you want? — I want a bicycle."]])+NT("8. What is this？");}};
U1[8]={t:"8. What is this？",c:function(){return G("文法 ▶ What is this？",e("What is")+" this? — "+e("It is")+" a desk."+j("（それは机です。）")+br+e("What is")+" that? — "+e("It's")+" a dog.","☞ "+k("What is this(that)?")+"「これは（あれは）何ですか。」　☞ "+k("it（それは）")+"で答えます。")+Q("【問】",[["これは何ですか。― それは鉛筆です。","What is this? — It is a pencil."],["あれは何ですか。― それはピアノです。","What is that? — It is a piano."],["これは何ですか。― カメラです。","What is this? — It is a camera."],["あれは何ですか。― テーブルです。","What is that? — It is a table."]])+NT("9. 疑問詞＋is・疑問詞＋do");}};
U1[9]={t:"9. 疑問詞＋is・疑問詞＋do",c:function(){return G("文法 ▶ 疑問詞を使った疑問文",e("What is")+" this? / "+e("Who is")+" that? / "+e("Where")+" is your school? / "+e("When")+" is your birthday?","☞ 疑問詞を使った疑問文は"+k("疑問詞＋疑問文？")+"の形になります。Yes・Noではなく"+k("主語＋動詞")+"の形で答えます。")+Q("【問 1〜3】",[["これは何ですか。― それは鉛筆です。","What is this? — It is a pencil."],["あちらはだれですか。― あちらは私の弟です。","Who is that? — That is my brother."],["あなたはどこでサッカーをしますか。― 私は公園でします。","Where do you play soccer? — I play it in the park."],["コンサートはいつですか。― ７月５日です。","When is the concert? — It is on July 5."],["あなたはどのようにして公園に行きますか。― 私は自転車で行きます。","How do you go to the park? — I go by bicycle."]])+NT("10. What＋名詞");}};
U1[10]={t:"10. What＋名詞",c:function(){return G("文法 ▶ What time is it？・What＋名詞",e("What time")+" is it? — It is nine."+br+e("What time")+" do you go to school? — At eight."+br+e("What sports")+" can we play here?","☞ "+k("What time is it?")+"「何時ですか。」　☞ "+k("What＋名詞＋疑問文?")+"「どんな〜を…」")+Q("【問 1〜3】",[["今、何時ですか。― 11時です。","What time is it? — It is eleven (o'clock)."],["東京は何時ですか。― 正午です。","What time is it in Tokyo? — It is noon."],["あなたは何時に昼食を食べますか。","What time do you eat lunch?"],["私は12時に昼食を食べます。","I eat lunch at twelve (noon)."],["あなたは何色が好きですか。― 私は青色（blue）が好きです。","What color do you like? — I like blue."],["私たちは動物園でどんな動物を見ることができますか。","What animals can we see in the zoo?"]])+NT("11. He is〜・She is〜");}};
U1[11]={t:"11. He is〜・She is〜",c:function(){return G("文法 ▶ He is〜 ・ She is〜（肯定文・疑問文・否定文）","This is Kenji. "+e("He is")+" my brother."+j("（彼は私の弟です。）")+br+"That is Ms. Green. "+e("She is")+" an English teacher."+j("（彼女は英語の先生です。）")+br+e("Is he")+" a math teacher? — Yes, "+e("he is.")+" / No, "+e("he isn't.")+br+e("He isn't")+" from Hokkaido.","☞ "+k("He is〜")+"「彼は〜です。」　☞ "+k("She is〜")+"「彼女は〜です。」")+Q("【問 1〜3】",[["こちらはリサ（Lisa）です。彼女は学生です。","This is Lisa. She is a student."],["あちらはブラウンさん（Mr. Brown）です。彼は医者です。","That is Mr. Brown. He is a doctor."],["彼はあなたの父親ですか。― はい、そうです。","Is he your father? — Yes, he is."],["彼女は音楽の先生ですか。― いいえ、ちがいます。","Is she a music teacher? — No, she isn't."],["彼はサッカーファンではありません。","He isn't a soccer fan."],["彼女は私の妹ではありません。","She isn't my sister."]])+NT("12. 一般動詞②（三人称単数）");}};
U1[12]={t:"12. 一般動詞②（三人称単数）",c:function(){return G("文法 ▶ 三人称単数（肯定文・疑問文・否定文）",pt("一・二人称","#1a5fa8")+"I "+e("like")+" oranges."+j("（私はオレンジが好きです。）")+br+pt("三人称単数","#d97706")+"He "+e("likes")+" apples."+j("（彼はリンゴが好きです。）")+br+e("Does he")+" watch TV? — Yes, "+e("he does.")+" / No, "+e("he doesn't.")+br+"My sister "+e("doesn't play")+" the piano.","☞ 主語が三人称単数のとき一般動詞に"+k("s(es)")+"をつけます。　☞ 疑問文は"+k("Does")+"で始め一般動詞は"+k("原形")+"になります。")+Q("【問 1〜3】",[["私の父は車を洗います。","My father washes his car."],["彼女は毎日英語を勉強します。","She studies English every day."],["その列車は博多に行きます。","The train goes to Hakata."],["彼は犬を飼っています。","He has a dog."],["彼は毎日学校に行きますか。― はい、行きます。","Does he go to school every day? — Yes, he does."],["彼女は私の名前を知っていますか。― いいえ、知りません。","Does she know my name? — No, she doesn't."],["香奈は日本に住んでいません。","Kana doesn't live in Japan."],["私の母は英語を話しません。","My mother doesn't speak English."]])+NT("13. 人称代名詞");}};
U1[13]={t:"13. 人称代名詞",c:function(){return G("文法 ▶ 人称代名詞","This is Kumi. "+e("She")+" is from Japan.","☞ 人や物の名前の代わりに使う名詞を"+k("代名詞")+"といいます。")+PRTBL+Q("【問】下線部の語（句）を代名詞１語で書きかえなさい。",[["<u>The boy</u> is Kenji.","He（The boy → He）"],["This is <u>Keiko's</u> camera.","her（Keiko's → her）"],["<u>Mike and I</u> are good friends.","We（Mike and I → We）"],["I use <u>these pens</u>.","them（these pens → them）"],["I know <u>Lisa's</u> brother.","her（Lisa's → her）"],["<u>That girl</u> is my sister.","She（That girl → She）"],["Do you know <u>Mr. Smith</u>?","him（Mr. Smith → him）"],["<u>Bob and Lisa</u> are my friends.","They（Bob and Lisa → They）"],["This racket is <u>Kenji's</u>.","his（Kenji's → his）"],["This is a letter for <u>my mother</u>.","her（my mother → her）"]])+NT("14. 助動詞 can");}};
U1[14]={t:"14. 助動詞 can",c:function(){return G("文法 ▶ can（全主語）・疑問文・否定文・会話表現","I "+e("can speak")+" English."+j("（私は英語を話すことができます。）")+br+"She "+e("can play")+" the piano."+j("（彼女はピアノを弾くことができます。）")+br+e("Can you")+" use a computer? — Yes, I "+e("can.")+" / No, I "+e("can't.")+br+e("Can I")+" use this desk? — Sure. / Sorry, you can't."+br+e("Can you")+" help me? — Sure. / Sorry, I can't.","☞ "+k("can＋動詞の原形")+"「〜することができる」　☞ "+k("Can I〜?")+"「〜してもいいですか。」　☞ "+k("Can you〜?")+"「〜してくれませんか。」")+Q("【問 1〜4】",[["あなたたちはこの本を読むことができます。","You can read this book."],["あなたは上手に泳ぐことができますか。― はい、できます。","Can you swim well? — Yes, I can."],["彼女はこの歌を歌うことができますか。― いいえ、できません。","Can she sing this song? — No, she can't."],["彼らはお寿司を食べることができません。","They can't eat sushi."],["テレビを観てもいいですか。― いいですよ。","Can I watch TV? — Sure. (OK.)"],["窓を開けてくれませんか。― すみません、開けることができません。","Can you open the window? — (I'm) sorry, I can't."]])+NT("15. 現在進行形");}};
U1[15]={t:"15. 現在進行形",c:function(){return G("文法 ▶ 現在進行形（肯定文・疑問文・否定文）","I "+e("am playing")+" soccer now."+j("（私は今サッカーをしています。）")+br+"She "+e("is writing")+" a letter."+j("（彼女は手紙を書いています。）")+br+e("Is he using")+" a computer? — Yes, "+e("he is.")+" / No, "+e("he isn't.")+br+e("What are you doing")+" now? — I am taking pictures.","☞ "+k("be動詞＋〜ing")+"の形で「"+k("〜している（ところだ）")+"」という意味を表します。")+Q("【問 1〜4】",[["私は今英語を勉強しているところです。","I am studying English now."],["彼女は本を読んでいるところです。","She is reading a book."],["私たちは川で泳いでいるところです。","We are swimming in the river."],["あなたは今自分の部屋を掃除しているところですか。― はい、掃除しています。","Are you cleaning your room now? — Yes, I am."],["彼女は音楽を聴いているところですか。― いいえ、聴いていません。","Is she listening to music? — No, she isn't."],["彼女はピアノを弾いているところではありません。","She isn't playing the piano."],["彼らは今昼食を食べているところではありません。","They aren't eating lunch now."],["あなたは何を作っていますか。― 私はイスを作っています。","What are you making? — I am making a chair."],["彼女は今何を食べていますか。― 彼女はお寿司を食べています。","What is she eating now? — She is eating sushi."]])+NT("16. 感嘆文");}};
U1[16]={t:"16. 感嘆文",c:function(){return G("文法 ▶ 感嘆文（How〜 ・ What〜）","① "+e("How beautiful")+" this flower is!"+j("（この花はなんて美しいのでしょう！）")+br+"② "+e("What a beautiful flower")+" this is!"+j("（これはなんて美しい花なのでしょう！）"),"☞ 「なんて〜だろう！」という強い感情を表す文を"+k("感嘆文")+"といいます。")+Q("【問 1〜2】",[["あのカバンはなんてすてき（nice）なのでしょう！","How nice that bag is!"],["あれはなんてすてきなカバンでしょう！","What a nice bag that is!"],["この本はなんておもしろいのでしょう！","How interesting this book is!"],["これはなんておもしろい本でしょう！","What an interesting book this is!"],["彼はなんて速く走るのでしょう！","How fast he runs!"],["あなたはなんて美しい目（eyes）をしているのでしょう！","What beautiful eyes you have!"],["なんてかわいいのでしょう！","How cute!"],["なんて大きな犬なのでしょう！","What a big dog!"],])+NT("17. 一般動詞の過去形");}};
U1[17]={t:"17. 一般動詞の過去形",c:function(){return G("文法 ▶ 過去形（規則変化・不規則変化・疑問文・否定文）",pt("現在形","#1a5fa8")+"He "+e("plays")+" soccer every day."+br+pt("過去形","#d97706")+"He "+e("played")+" baseball yesterday."+j("（彼は昨日野球をしました。）")+br+"She "+e("went")+" to the library yesterday."+j("（彼女は昨日図書館に行きました。）")+br+e("Did he watch")+" TV yesterday? — Yes, "+e("he did.")+" / No, "+e("he didn't."),"☞ 過去の文を表すには一般動詞に"+k("d(ed)")+"をつけます。　☞ 疑問文は"+k("Did")+"で始め一般動詞は"+k("原形")+"になります。")+Q("【問 1〜5】",[["私の父は先週自分の車を洗いました。","My father washed his car last week."],["彼女は昨晩英語を勉強しました。","She studied English last night."],["私は昨日手紙を書きました。","I wrote a letter yesterday."],["彼は先週川で泳ぎました。","He swam in the river last week."],["あなたは今朝早く起きましたか。― はい、起きました。","Did you get up early this morning? — Yes, I did."],["彼女はあなたの名前を知っていましたか。― いいえ、知りませんでした。","Did she know your name? — No, she didn't."],["彼らは先月京都を訪れませんでした。","They didn't visit Kyoto last month."],["私は昨日このコンピューターを使いませんでした。","I didn't use this computer yesterday."],["あなたは昨日どこに行きましたか。","Where did you go yesterday?"],["彼らは何時に駅に着きましたか。","What time did they arrive at the station?"]])+NT("18. 疑問詞");}};
U1[18]={t:"18. 疑問詞",c:function(){return G("文法 ▶ 疑問詞を使った疑問文",e("What")+" do you usually do on Sundays?"+br+e("Where")+" did you go yesterday?"+br+e("Who")+" cooks dinner every day? — My mother "+e("does.")+br+e("How many books")+" do you have? / "+e("How old")+" is your father?","☞ 疑問詞を使った疑問文は"+k('"疑問詞＋疑問文？"')+"の形になります。　☞ Yes・Noではなく"+k("主語＋動詞")+"の形で答えます。")+Q("【問 1〜3】",[["あなたのおじは何を飲みましたか。― 彼はお茶を飲みました。","What did your uncle drink? — He drank tea."],["あなたは毎日どこで勉強しますか。― 私は自分の部屋で勉強します。","Where do you study every day? — I study in my room."],["あなたはふつうどのようにして学校に行きますか。― 私はバスで行きます。","How do you usually go to school? — I go by bus."],["だれがギターを弾くことができますか。― 私の兄ができます。","Who can play the guitar? — My brother can."],["だれがそのコンピューターを使いましたか。― タケシが使いました。","Who used that computer? — Takeshi did."],["あなたはいくつのケーキを食べましたか。― 私は３つ食べました。","How many cakes did you eat? — I ate three."],["このカバンはいくらですか。― ２千円です。","How much is this bag? — It is two thousand yen."]])+'<div class="nt" style="background:#e8f1fb;border-color:#1a5fa8;color:#1a5fa8">🎉 <span class="nx">中 1 全 18 単元　完了！</span></div>';}};
var U2={};
U2[1]={t:"1. be動詞の過去形",c:function(){return G("文法 ▶ was・were（肯定文・疑問文・否定文）",pt("現在形","#1a5fa8")+"I "+e("am")+" in Kyoto now."+br+pt("過去形","#d97706")+"I "+e("was")+" in Tokyo yesterday."+j("（私は昨日東京にいました。）")+br+pt("過去形","#d97706")+"We "+e("were")+" tired then."+br+e("Was it")+" cold yesterday? — Yes, it "+e("was.")+" / No, it "+e("wasn't.")+br+"My mother "+e("wasn't")+" (at) home yesterday.","☞ be動詞の過去形 "+k("was・were")+" は「"+k("〜でした、いました")+"」という意味を表します。")+Q("【問 1〜3】",[["昨日は雨でした。","It was rainy yesterday."],["私たちは昨年は高校生でした。","We were high school students last year."],["私の弟と私は昨日の午後は忙しかった。","My brother and I were busy yesterday afternoon."],["彼女はクラスで人気がありましたか。― はい、人気がありました。","Was she popular in her class? — Yes, she was."],["あなたは昨年中国にいましたか。― いいえ、いませんでした。","Were you in China last year? — No, I wasn't."],["先週は暖かくありませんでした。","It wasn't warm last week."],["私たちはそのとき（then）幸せではありませんでした。","We weren't happy then."],["彼らは３日前は日本にいませんでした。","They weren't in Japan three days ago."]])+NT("2. 過去進行形");}};
U2[2]={t:"2. 過去進行形",c:function(){return G("文法 ▶ 過去進行形（肯定文・疑問文・否定文・疑問詞）",pt("現在進行形","#1a5fa8")+"I "+e("am playing")+" soccer now."+br+pt("過去進行形","#d97706")+"I "+e("was playing")+" soccer then."+j("（私はそのときサッカーをしていました。）")+br+e("Was your brother using")+" that computer? — Yes, he "+e("was.")+" / No, he "+e("wasn't.")+br+e("What were you doing")+" at that time? — I was taking pictures.","☞ "+k("was(were)＋〜ing")+"の形で「"+k("〜していました")+"」という意味を表します。")+Q("【問 1〜4】",[["私はそのとき英語を勉強していました。","I was studying English then."],["彼女はそのとき本を読んでいました。","She was reading a book then."],["私たちはそのとき川で泳いでいました。","We were swimming in the river then."],["あなたはそのとき自分の部屋を掃除していましたか。― はい、掃除していました。","Were you cleaning your room then? — Yes, I was."],["彼女はそのとき音楽を聴いていましたか。― いいえ、聴いていませんでした。","Was she listening to music then? — No, she wasn't."],["恵子はそのときピアノを弾いていませんでした。","Keiko wasn't playing the piano then."],["私たちはそのときテレビを観ていませんでした。","We weren't watching TV then."],["彼らはそのとき昼食を食べていませんでした。","They weren't eating lunch then."],["あなたはそのときどこで泳いでいましたか。","Where were you swimming then?"],["彼女はそのとき何を食べていましたか。","What was she eating then?"]])+NT("3. 未来形（be going to〜）");}};
U2[3]={t:"3. 未来形（be going to〜）",c:function(){return G("文法 ▶ be going to〜（肯定文・疑問文・否定文）","I "+e("am going to play")+" tennis this afternoon."+j("（私は今日の午後テニスをするつもり[予定]です。）")+br+e("Are you going to")+" go to Kyoto? — Yes, I "+e("am.")+" / No, I'm "+e("not.")+br+"She "+e("isn't going to watch")+" TV today.","☞ "+k("be going to＋動詞の原形")+"で「"+k("〜するつもりだ")+"」「"+k("〜する予定だ")+"」という意味を表します。")+Q("【問 1〜4】",[["私は彼女のためにその本を買うつもりです。","I am going to buy the book for her."],["彼らは来年英語を学ぶ予定です。","They are going to study English next year."],["あなたは来週ここに来るつもりですか。― はい、そのつもりです。","Are you going to come here next week? — Yes, I am."],["彼は明日図書館に行く予定ですか。― いいえ、その予定ではありません。","Is he going to go to the library tomorrow? — No, he isn't."],["彼らは今日の午後野球をするつもりはありません。","They aren't going to play baseball this afternoon."],["久美は明日母を手伝うつもりはありません。","Kumi isn't going to help her mother tomorrow."],["あなたは今日の午後どこに行く予定ですか。","Where are you going to go this afternoon?"],["彼はその店（the shop）で何を買うつもりですか。","What is he going to buy at the shop?"]])+NT("4. must・have to〜");}};
U2[4]={t:"4. must〜・have to〜",c:function(){return G("文法 ▶ must〜・have to〜（肯定文・否定文・疑問文）","I "+e("must do")+" my homework this afternoon."+j("（私は今日の午後宿題をしなければなりません。）")+br+"I "+e("have to do")+" my homework this afternoon."+j("（私は今日の午後宿題をしなければなりません。）")+br+"We "+e("must not play")+" baseball here."+j("（してはいけない）")+"　We "+e("don't have to help")+" him today."+j("（〜する必要はない）"),"☞ "+k("must＋動詞の原形")+"「〜しなければならない」　☞ "+k("must not")+"「〜してはいけない」　☞ "+k("don't have to")+"「〜する必要はない」")+Q("【問 1〜3】",[["私は母を手伝わなければなりません。（mustを使って）","I must help my mother."],["私は母を手伝わなければなりません。（have toを使って）","I have to help my mother."],["彼女は午後図書館に行かなければなりません。（mustを使って）","She must go to the library in the afternoon."],["彼女は午後図書館に行かなければなりません。（has toを使って）","She has to go to the library in the afternoon."],["あなたは今日自分の部屋を掃除する必要はありません。","You don't have to clean your room today."],["あなたはここで日本語を話してはいけません。","You must not speak Japanese here."],["私たちは今日の午後学校に行く必要はありません。","We don't have to go to school this afternoon."],["彼らは今テレビを観てはいけません。","They must not watch TV now."],["私はここに滞在しなければなりませんか。（mustを使って）","Must I stay here?"],["はい、そうしなければなりません。","Yes, you must."],["彼らは今日英語を勉強しなければなりませんか。（mustを使って）","Must they study English today?"],["いいえ、その必要はありません。","No, they don't have to."]])+NT("5. 接続詞");}};
